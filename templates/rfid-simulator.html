<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动化模拟</title>
    <link rel="stylesheet" href="/static/css/rfid-simulator.css">
</head>
<body>
    <div class="page-container">
        <!-- 第1栏：班级选择 -->
        <div class="select-panel">
            <div class="panel-header">
                <a href="/" class="back-link"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></a>
                <h1 class="panel-title">班级选择</h1>
            </div>
            <div class="favorite-section" id="favoriteSection">
                <div class="section-header"><span class="section-title">最近使用</span><button class="btn-text-sm" onclick="clearFavorites()">清空</button></div>
                <div class="favorite-cards" id="favoriteCards"><div class="favorite-empty">暂无记录</div></div>
            </div>
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="class">按班级</button>
                <button class="tab-btn" data-tab="book">按书本</button>
            </div>
            <div class="filter-bar" id="gradeFilterBar">
                <select class="grade-select" id="gradeSelect">
                    <option value="0">全部年级</option>
                    <option value="1">一年级</option>
                    <option value="2">二年级</option>
                    <option value="3">三年级</option>
                    <option value="4">四年级</option>
                    <option value="5">五年级</option>
                    <option value="6">六年级</option>
                    <option value="7">七年级</option>
                    <option value="8">八年级</option>
                    <option value="9">九年级</option>
                    <option value="10">高一</option>
                    <option value="11">高二</option>
                    <option value="12">高三</option>
                </select>
            </div>
            <div class="filter-bar" id="subjectFilterBar" style="display:none;">
                <button class="filter-btn active" data-subject="0">全部</button>
                <button class="filter-btn" data-subject="2">数学</button>
                <button class="filter-btn" data-subject="3">物理</button>
            </div>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索班级...">
            </div>
            <div class="list-container" id="listContainer"><div class="list-loading">加载中...</div></div>
        </div>

        <!-- 第2栏：自动化流程 -->
        <div class="workflow-panel center-panel">
            <div class="panel-header"><h2 class="panel-title">自动化流程</h2><button class="btn-text-sm" onclick="openCoordinateConfig()">坐标配置</button></div>
            <!-- 发布作业 -->
            <div class="workflow-card expanded" id="publishWorkflow">
                <div class="workflow-card-header" onclick="toggleWorkflowCard('publish')">
                    <div class="workflow-card-title"><span>发布作业</span></div>
                    <div class="workflow-card-status" id="publishStatus">待执行</div>
                </div>
                <div class="workflow-card-body" id="publishBody">
                    <!-- 模式切换 -->
                    <div class="publish-mode-switch">
                        <button class="mode-btn active" data-mode="smart" onclick="switchPublishMode('smart')">智能模式</button>
                        <button class="mode-btn" data-mode="manual" onclick="switchPublishMode('manual')">手动模式</button>
                    </div>
                    
                    <!-- 智能模式 -->
                    <div class="publish-mode-content" id="smartModeContent">
                        <div class="param-row">
                            <label>选择书本</label>
                            <select id="smartBookSelect" onchange="onSmartBookChange()">
                                <option value="">请选择书本...</option>
                            </select>
                        </div>
                        <div class="teacher-auto-info" id="teacherAutoInfo" style="display:none;">
                            <div class="auto-info-row">
                                <span class="auto-label">老师/班级</span>
                                <span class="auto-value" id="autoTeacherDisplay">-</span>
                                <button class="btn-text-sm" id="changeTeacherBtn" onclick="showTeacherSelectModal()" style="display:none;">切换</button>
                            </div>
                        </div>
                        <div class="param-row">
                            <label>页码</label>
                            <input type="text" id="smartPageRegion" placeholder="如: 1-3 或 5" oninput="updateSmartPublishBtn()">
                        </div>
                        <div class="preview-row" id="homeworkPreview" style="display:none;">
                            <span class="preview-label">作业名称</span>
                            <span class="preview-value" id="homeworkNamePreview">-</span>
                        </div>
                        <div class="workflow-btn-group">
                            <button class="btn-workflow" id="smartPublishBtn" onclick="smartPublish()" disabled>一键发布作业</button>
                        </div>
                    </div>
                    
                    <!-- 手动模式 -->
                    <div class="publish-mode-content" id="manualModeContent" style="display:none;">
                        <div class="workflow-params-inline">
                            <div class="param-row"><label>账号</label><input type="text" id="apiUsername" placeholder="教师账号" value="shuxue"></div>
                            <div class="param-row"><label>密码</label><input type="password" id="apiPassword" placeholder="密码" value="123456zp."></div>
                        </div>
                        <div class="api-login-status" id="apiLoginStatus">
                            <span class="status-dot offline"></span>
                            <span class="status-text">未登录</span>
                            <button class="btn-text-sm" onclick="apiLogin()">登录</button>
                        </div>
                        <div class="teacher-info-card" id="teacherInfoCard" style="display:none;">
                            <div class="info-row"><label>教师</label><span id="teacherName">-</span></div>
                            <div class="info-row"><label>科目</label><span id="teacherSubject">-</span></div>
                            <div class="param-row">
                                <label>书本</label>
                                <select id="apiBookSelect" onchange="onBookChange()"><option value="">请选择书本</option></select>
                            </div>
                            <div class="param-row">
                                <label>班级</label>
                                <select id="apiClassSelect"><option value="">请选择班级</option></select>
                            </div>
                            <div class="param-row"><label>页码</label><input type="text" id="apiPageRegion" placeholder="如: 1-3 或 5"></div>
                        </div>
                        <div class="workflow-btn-group">
                            <button class="btn-workflow" id="apiPublishBtn" onclick="oneClickPublish()" disabled>一键发布作业</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 提交作业 -->
            <div class="workflow-card" id="submitWorkflow">
                <div class="workflow-card-header" onclick="toggleWorkflowCard('submit')">
                    <div class="workflow-card-title"><span>提交作业</span></div>
                    <div class="workflow-card-status" id="submitStatus">待执行</div>
                </div>
                <div class="workflow-card-body" id="submitBody">
                    <div class="workflow-steps-list" id="submitStepsList"><div class="steps-loading">加载中...</div></div>
                    <button class="btn-add-step" onclick="addNewStep('submit_homework')">添加步骤</button>
                    <div class="workflow-params-inline">
                        <div class="param-row"><label>拍照间隔</label><input type="number" id="submitPhotoInterval" value="2" min="1" max="10"> 秒</div>
                        <div class="param-row"><label>双页模式</label><input type="checkbox" id="submitDoublePageMode" checked> 启用</div>
                    </div>
                    <div class="workflow-student-info" id="workflowStudentInfo" style="display:none;"><span>已选学生: </span><strong id="workflowStudentCount">0</strong> 人</div>
                    <div class="workflow-btn-group">
                        <button class="btn-workflow" id="submitStartBtn" onclick="runSubmitWorkflow()">执行提交流程</button>
                        <button class="btn-workflow-ctrl" id="submitPauseBtn" onclick="pauseSubmitWorkflow()" style="display:none;">暂停</button>
                        <button class="btn-workflow-ctrl" id="submitResumeBtn" onclick="resumeSubmitWorkflow()" style="display:none;">继续</button>
                        <button class="btn-workflow-stop" id="submitStopBtn" onclick="stopSubmitWorkflow()" style="display:none;">停止</button>
                    </div>
                </div>
            </div>
            <!-- 执行日志 -->
            <div class="execution-log">
                <div class="log-header">
                    <span class="log-title">执行日志</span>
                    <div class="log-stats"><span class="stat-badge success"><b id="logSuccessCount">0</b> 成功</span><span class="stat-badge error"><b id="logFailCount">0</b> 失败</span></div>
                    <button class="btn-text-sm" onclick="clearLogs()">清空</button>
                </div>
                <div class="log-list" id="logList"><div class="log-empty">暂无日志</div></div>
            </div>
        </div>

        <!-- 第3栏：RFID模拟 -->
        <div class="control-panel">
            <div class="panel-header"><h2 class="panel-title">RFID 模拟</h2></div>
            <!-- 关联书籍卡片 -->
            <div class="related-books-card" id="relatedBooksCard" style="display:none;">
                <div class="card-header"><span class="card-title">关联书籍</span><span class="book-count" id="bookCount">0</span></div>
                <div class="books-list" id="booksList"></div>
            </div>
            <div class="empty-hint" id="emptyHint"><span>从左侧选择班级或书本</span></div>
            <div class="selected-info-card" id="selectedInfo" style="display:none;">
                <div class="card-header"><span class="card-title" id="selectedTitle">-</span><button class="btn-text-sm" onclick="clearSelection()">清除</button></div>
                <div class="selected-meta">
                    <span class="meta-item">学生 <strong id="studentCount">0</strong></span>
                    <span class="meta-item">课代表 <strong id="repCount">0</strong></span>
                    <span class="meta-item">有效卡 <strong id="validCount">0</strong></span>
                </div>
                <div class="student-filter">
                    <label class="filter-radio"><input type="radio" name="studentFilter" value="all" checked><span>全部</span></label>
                    <label class="filter-radio"><input type="radio" name="studentFilter" value="rep"><span>课代表</span></label>
                    <label class="filter-radio"><input type="radio" name="studentFilter" value="normal"><span>普通学生</span></label>
                </div>
                <div class="student-list" id="studentList"><div class="student-empty">暂无学生数据</div></div>
            </div>
            <button class="btn-primary" id="startBtn" onclick="startBatch()" disabled>开始模拟</button>
            <div class="btn-group" id="runningBtns" style="display:none;">
                <button class="btn-secondary" id="pauseBtn" onclick="pauseBatch()">暂停</button>
                <button class="btn-secondary" id="resumeBtn" onclick="resumeBatch()" style="display:none;">继续</button>
                <button class="btn-danger" id="stopBtn" onclick="stopBatch()">停止</button>
            </div>
            <div class="connection-card">
                <div class="card-header"><span class="card-title">连接状态</span><button class="btn-icon" onclick="refreshStatus()" title="刷新"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button></div>
                <div class="connection-chain" id="connectionChain">
                    <div class="chain-node"><div class="node-dot" id="clientDot"></div><span class="node-label">客户端</span><span class="node-value" id="clientIp">未连接</span></div>
                    <div class="chain-node"><div class="node-dot online"></div><span class="node-label">服务器</span><span class="node-value">在线</span></div>
                    <div class="chain-node"><div class="node-dot" id="deviceDot"></div><span class="node-label">设备</span><span class="node-value" id="deviceIp">-</span></div>
                </div>
            </div>
            <div class="quick-test-card">
                <div class="card-header"><span class="card-title">快捷测试</span></div>
                <div class="quick-test-form"><input type="text" id="testCardNo" class="test-input" placeholder="输入卡号..."><button class="btn-send" onclick="sendTestCard()">发送</button></div>
                <div class="preset-cards">
                    <button class="preset-btn" onclick="sendPreset('1234567890')">测试卡1</button>
                    <button class="preset-btn" onclick="sendPreset('9876543210')">测试卡2</button>
                </div>
            </div>

        </div>
    </div>
    
    <!-- 老师选择弹窗 -->
    <div class="modal" id="teacherSelectModal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择老师/班级</h3>
                <button class="modal-close" onclick="closeTeacherSelectModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>该书本有多个老师绑定，请选择：</p>
                <div class="teacher-select-list" id="teacherSelectList"></div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/rfid-simulator.js"></script>
    <script src="/static/js/workflow-builder.js"></script>
</body>
</html>
